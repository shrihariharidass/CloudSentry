<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Custodian Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e1e8ed;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #2d1b69 100%);
            padding: 24px 40px;
            border-bottom: 1px solid #2a3040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 24px; font-weight: 600; color: #fff; }
        .header p { color: #8899a6; margin-top: 4px; font-size: 14px; }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8899a6;
            font-size: 13px;
        }

        .auto-refresh .dot {
            width: 8px; height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 32px 40px; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a3040;
            padding-bottom: 0;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #8899a6;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active { color: #fff; border-bottom-color: #3498db; }
        .tab:hover { color: #fff; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .summary-card {
            background: #1c2128;
            border: 1px solid #2a3040;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .summary-card .number { font-size: 36px; font-weight: 700; margin-bottom: 4px; }
        .summary-card .label {
            font-size: 13px; color: #8899a6;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .number.green { color: #2ecc71; }
        .number.red { color: #e74c3c; }
        .number.blue { color: #3498db; }
        .number.orange { color: #f39c12; }

        .section-title {
            font-size: 18px; margin-bottom: 16px; color: #fff;
            display: flex; justify-content: space-between; align-items: center;
        }

        .last-updated { font-size: 12px; color: #8899a6; font-weight: normal; }

        .policy-card {
            background: #1c2128;
            border: 1px solid #2a3040;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .policy-card:hover { border-color: #3498db; }

        .policy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
        }

        .policy-name { font-size: 15px; font-weight: 500; }

        .policy-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }

        .badge-compliant { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
        .badge-violation { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }

        .policy-details {
            display: none;
            padding: 0 20px 16px;
            border-top: 1px solid #2a3040;
        }

        .policy-details.open { display: block; }

        .resource-table {
            width: 100%; border-collapse: collapse;
            margin-top: 12px; font-size: 13px;
        }

        .resource-table th {
            text-align: left; padding: 10px 12px;
            background: #161b22; color: #8899a6;
            font-weight: 500; text-transform: uppercase;
            font-size: 11px; letter-spacing: 0.5px;
        }

        .resource-table td {
            padding: 10px 12px;
            border-top: 1px solid #2a3040;
            color: #c9d1d9;
        }

        .resource-table tr:hover td { background: #161b22; }

        .tag-chip {
            display: inline-block;
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            padding: 2px 8px; border-radius: 4px;
            font-size: 11px; margin: 2px;
        }

        .matched-filter {
            display: inline-block;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            padding: 2px 8px; border-radius: 4px;
            font-size: 11px; margin: 2px;
        }

        .event-card {
            background: #1c2128;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-name { font-weight: 500; font-size: 14px; }
        .event-meta { color: #8899a6; font-size: 12px; }
        .event-source { color: #f39c12; font-size: 12px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .loading { text-align: center; padding: 60px; color: #8899a6; }

        @media (max-width: 768px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>☁️ Cloud Custodian Dashboard</h1>
            <p>Real-time policy compliance monitoring</p>
        </div>
        <div class="auto-refresh">
            <span class="dot"></span>
            <span>Auto-refresh: 30s</span>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('policies')">Policy Results</div>
            <div class="tab" onclick="switchTab('cloudtrail')">CloudTrail Events</div>
        </div>

        <div id="policies-tab" class="tab-content active">
            <div class="loading">Loading results...</div>
        </div>

        <div id="cloudtrail-tab" class="tab-content">
            <div class="loading">Loading CloudTrail events...</div>
        </div>
    </div>

    <script>
        let refreshInterval;

        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();
                renderPolicies(data);
            } catch (error) {
                document.getElementById('policies-tab').innerHTML =
                    '<div class="loading">Error loading results.</div>';
            }
        }

        async function loadCloudTrail() {
            try {
                const response = await fetch('/api/cloudtrail-events');
                const data = await response.json();
                renderCloudTrail(data);
            } catch (error) {
                document.getElementById('cloudtrail-tab').innerHTML =
                    '<div class="loading">Error loading CloudTrail events.</div>';
            }
        }

        function renderPolicies(data) {
            const { summary, policies } = data;
            const container = document.getElementById('policies-tab');

            let html = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="number blue">${summary.total_policies}</div>
                        <div class="label">Total Policies</div>
                    </div>
                    <div class="summary-card">
                        <div class="number green">${summary.compliant_policies}</div>
                        <div class="label">Compliant</div>
                    </div>
                    <div class="summary-card">
                        <div class="number red">${summary.non_compliant_policies}</div>
                        <div class="label">Non-Compliant</div>
                    </div>
                    <div class="summary-card">
                        <div class="number orange">${summary.total_violations}</div>
                        <div class="label">Total Violations</div>
                    </div>
                </div>
                <div class="section-title">
                    <span>Policy Results</span>
                    <span class="last-updated">Last refreshed: ${new Date().toLocaleTimeString()}</span>
                </div>
            `;

            policies.forEach((policy, index) => {
                const isCompliant = policy.resource_count === 0;
                const badgeClass = isCompliant ? 'badge-compliant' : 'badge-violation';
                const badgeText = isCompliant ? '✓ Compliant' : `✗ ${policy.resource_count} violation(s)`;

                html += `
                    <div class="policy-card">
                        <div class="policy-header" onclick="toggleDetails(${index})">
                            <span class="policy-name">${policy.name}</span>
                            <span class="policy-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="policy-details" id="details-${index}">
                            ${renderResources(policy)}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderCloudTrail(data) {
            const container = document.getElementById('cloudtrail-tab');

            if (data.error) {
                container.innerHTML = `<div class="loading">CloudTrail access error: ${data.error}</div>`;
                return;
            }

            if (!data.events || data.events.length === 0) {
                container.innerHTML = '<div class="loading">No recent write events found.</div>';
                return;
            }

            let html = '<div class="section-title"><span>Recent Write Events (Resource Changes)</span></div>';

            data.events.forEach(event => {
                const resources = event.resources.map(r => `${r.type || ''}: ${r.name || 'N/A'}`).join(', ');
                const time = event.event_time ? new Date(event.event_time).toLocaleString() : 'N/A';

                html += `
                    <div class="event-card">
                        <div>
                            <div class="event-name">${event.event_name}</div>
                            <div class="event-meta">${event.username || 'N/A'} • ${time}</div>
                            ${resources ? `<div class="event-meta">${resources}</div>` : ''}
                        </div>
                        <div class="event-source">${event.event_source || ''}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderResources(policy) {
            if (policy.resource_count === 0) {
                return '<p style="color: #2ecc71; padding-top: 12px;">All resources are compliant.</p>';
            }

            const resources = policy.resources;
            const first = resources[0];

            if (first.InstanceId) return renderEC2Table(resources);
            if (first.BucketName || first.Name) return renderS3Table(resources);
            if (first.VolumeId) return renderEBSTable(resources);
            return renderGenericTable(resources);
        }

        function renderEC2Table(resources) {
            let html = `<table class="resource-table"><thead><tr>
                <th>Instance ID</th><th>Type</th><th>State</th><th>Tags</th><th>Matched Filters</th>
            </tr></thead><tbody>`;

            resources.forEach(r => {
                const tags = (r.Tags || []).map(t => `<span class="tag-chip">${t.Key}: ${t.Value}</span>`).join('');
                const filters = (r['c7n:MatchedFilters'] || []).map(f => `<span class="matched-filter">${f}</span>`).join('');
                html += `<tr><td>${r.InstanceId}</td><td>${r.InstanceType || '-'}</td>
                    <td>${r.State ? r.State.Name : '-'}</td><td>${tags || '-'}</td><td>${filters || '-'}</td></tr>`;
            });

            return html + '</tbody></table>';
        }

        function renderS3Table(resources) {
            let html = `<table class="resource-table"><thead><tr>
                <th>Bucket Name</th><th>Creation Date</th><th>Matched Filters</th>
            </tr></thead><tbody>`;

            resources.forEach(r => {
                const name = r.BucketName || r.Name || '-';
                const filters = (r['c7n:MatchedFilters'] || []).map(f => `<span class="matched-filter">${f}</span>`).join('');
                html += `<tr><td>${name}</td><td>${r.CreationDate || '-'}</td><td>${filters || '-'}</td></tr>`;
            });

            return html + '</tbody></table>';
        }

        function renderEBSTable(resources) {
            let html = `<table class="resource-table"><thead><tr>
                <th>Volume ID</th><th>Size (GB)</th><th>State</th><th>Encrypted</th><th>Matched Filters</th>
            </tr></thead><tbody>`;

            resources.forEach(r => {
                const filters = (r['c7n:MatchedFilters'] || []).map(f => `<span class="matched-filter">${f}</span>`).join('');
                html += `<tr><td>${r.VolumeId}</td><td>${r.Size || '-'}</td><td>${r.State || '-'}</td>
                    <td>${r.Encrypted ? 'Yes' : 'No'}</td><td>${filters || '-'}</td></tr>`;
            });

            return html + '</tbody></table>';
        }

        function renderGenericTable(resources) {
            return `<pre style="background:#161b22;padding:12px;border-radius:8px;overflow-x:auto;margin-top:12px;font-size:12px;">${JSON.stringify(resources, null, 2)}</pre>`;
        }

        function toggleDetails(index) {
            document.getElementById(`details-${index}`).classList.toggle('open');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');

            if (tab === 'cloudtrail') loadCloudTrail();
        }

        // Initial load
        loadResults();

        // Auto-refresh every 30 seconds
        refreshInterval = setInterval(() => {
            loadResults();
        }, 30000);
    </script>
</body>
</html>
