<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Custodian Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e1e8ed;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #2d1b69 100%);
            padding: 24px 40px;
            border-bottom: 1px solid #2a3040;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }

        .header p {
            color: #8899a6;
            margin-top: 4px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .summary-card {
            background: #1c2128;
            border: 1px solid #2a3040;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .summary-card .number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .summary-card .label {
            font-size: 13px;
            color: #8899a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .number.green { color: #2ecc71; }
        .number.red { color: #e74c3c; }
        .number.blue { color: #3498db; }
        .number.orange { color: #f39c12; }

        .policies-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #fff;
        }

        .policy-card {
            background: #1c2128;
            border: 1px solid #2a3040;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .policy-card:hover {
            border-color: #3498db;
        }

        .policy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
        }

        .policy-name {
            font-size: 15px;
            font-weight: 500;
        }

        .policy-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-compliant {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .badge-violation {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }

        .policy-details {
            display: none;
            padding: 0 20px 16px;
            border-top: 1px solid #2a3040;
        }

        .policy-details.open {
            display: block;
        }

        .resource-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }

        .resource-table th {
            text-align: left;
            padding: 10px 12px;
            background: #161b22;
            color: #8899a6;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .resource-table td {
            padding: 10px 12px;
            border-top: 1px solid #2a3040;
            color: #c9d1d9;
        }

        .resource-table tr:hover td {
            background: #161b22;
        }

        .tag-chip {
            display: inline-block;
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin: 2px;
        }

        .matched-filter {
            display: inline-block;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8899a6;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #8899a6;
        }

        @media (max-width: 768px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>☁️ Cloud Custodian Dashboard</h1>
        <p>Policy compliance results — open source governance as code</p>
    </div>

    <div class="container">
        <div id="app">
            <div class="loading">Loading results...</div>
        </div>
    </div>

    <script>
        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                document.getElementById('app').innerHTML =
                    '<div class="empty-state"><p>Error loading results. Make sure you have run custodian policies first.</p></div>';
            }
        }

        function renderDashboard(data) {
            const { summary, policies } = data;
            const app = document.getElementById('app');

            let html = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="number blue">${summary.total_policies}</div>
                        <div class="label">Total Policies</div>
                    </div>
                    <div class="summary-card">
                        <div class="number green">${summary.compliant_policies}</div>
                        <div class="label">Compliant</div>
                    </div>
                    <div class="summary-card">
                        <div class="number red">${summary.non_compliant_policies}</div>
                        <div class="label">Non-Compliant</div>
                    </div>
                    <div class="summary-card">
                        <div class="number orange">${summary.total_violations}</div>
                        <div class="label">Total Violations</div>
                    </div>
                </div>

                <div class="policies-section">
                    <h2>Policy Results</h2>
            `;

            policies.forEach((policy, index) => {
                const isCompliant = policy.resource_count === 0;
                const badgeClass = isCompliant ? 'badge-compliant' : 'badge-violation';
                const badgeText = isCompliant ? '✓ Compliant' : `✗ ${policy.resource_count} violation(s)`;

                html += `
                    <div class="policy-card">
                        <div class="policy-header" onclick="toggleDetails(${index})">
                            <span class="policy-name">${policy.name}</span>
                            <span class="policy-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="policy-details" id="details-${index}">
                            ${renderResources(policy)}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            app.innerHTML = html;
        }

        function renderResources(policy) {
            if (policy.resource_count === 0) {
                return '<p style="color: #2ecc71; padding-top: 12px;">All resources are compliant with this policy.</p>';
            }

            const resources = policy.resources;
            const firstResource = resources[0];

            // Detect resource type and render appropriate table
            if (firstResource.InstanceId) {
                return renderEC2Table(resources);
            } else if (firstResource.BucketName || firstResource.Name) {
                return renderS3Table(resources);
            } else if (firstResource.VolumeId) {
                return renderEBSTable(resources);
            } else {
                return renderGenericTable(resources);
            }
        }

        function renderEC2Table(resources) {
            let html = `
                <table class="resource-table">
                    <thead>
                        <tr>
                            <th>Instance ID</th>
                            <th>Type</th>
                            <th>State</th>
                            <th>Tags</th>
                            <th>Matched Filters</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            resources.forEach(r => {
                const tags = (r.Tags || []).map(t => `<span class="tag-chip">${t.Key}: ${t.Value}</span>`).join('');
                const filters = (r['c7n:MatchedFilters'] || []).map(f => `<span class="matched-filter">${f}</span>`).join('');

                html += `
                    <tr>
                        <td>${r.InstanceId}</td>
                        <td>${r.InstanceType || '-'}</td>
                        <td>${r.State ? r.State.Name : '-'}</td>
                        <td>${tags || '-'}</td>
                        <td>${filters || '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            return html;
        }

        function renderS3Table(resources) {
            let html = `
                <table class="resource-table">
                    <thead>
                        <tr>
                            <th>Bucket Name</th>
                            <th>Creation Date</th>
                            <th>Matched Filters</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            resources.forEach(r => {
                const name = r.BucketName || r.Name || '-';
                const filters = (r['c7n:MatchedFilters'] || []).map(f => `<span class="matched-filter">${f}</span>`).join('');

                html += `
                    <tr>
                        <td>${name}</td>
                        <td>${r.CreationDate || '-'}</td>
                        <td>${filters || '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            return html;
        }

        function renderEBSTable(resources) {
            let html = `
                <table class="resource-table">
                    <thead>
                        <tr>
                            <th>Volume ID</th>
                            <th>Size (GB)</th>
                            <th>State</th>
                            <th>Encrypted</th>
                            <th>Matched Filters</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            resources.forEach(r => {
                const filters = (r['c7n:MatchedFilters'] || []).map(f => `<span class="matched-filter">${f}</span>`).join('');

                html += `
                    <tr>
                        <td>${r.VolumeId}</td>
                        <td>${r.Size || '-'}</td>
                        <td>${r.State || '-'}</td>
                        <td>${r.Encrypted ? 'Yes' : 'No'}</td>
                        <td>${filters || '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            return html;
        }

        function renderGenericTable(resources) {
            let html = '<pre style="background: #161b22; padding: 12px; border-radius: 8px; overflow-x: auto; margin-top: 12px; font-size: 12px;">';
            html += JSON.stringify(resources, null, 2);
            html += '</pre>';
            return html;
        }

        function toggleDetails(index) {
            const details = document.getElementById(`details-${index}`);
            details.classList.toggle('open');
        }

        // Load on page ready
        loadResults();
    </script>
</body>
</html>
