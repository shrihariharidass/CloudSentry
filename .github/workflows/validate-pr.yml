name: Validate Policies (PR Check)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/policies/**'
      - 'policy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cloud Custodian
        run: pip install c7n

      - name: Replace account ID placeholders
        run: |
          sed -i 's/{account_id}/858688858026/g' backend/policies/*.yml

      - name: Validate all policies
        run: |
          custodian validate policy.yml
          custodian validate backend/policies/realtime-tag-enforcement.yml
          custodian validate backend/policies/scheduled-scan.yml

      - name: Dry run local policies
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          custodian run --dryrun -s /tmp/output --cache-period 0 policy.yml
          echo "Matched resources:"
          cat /tmp/output/*/resources.json 2>/dev/null || echo "No violations found"
