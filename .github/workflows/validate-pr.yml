name: Validate Policies (PR Check)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/policies/**'
      - 'policy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cloud Custodian
        run: pip install c7n

      - name: Replace account ID placeholders
        run: |
          sed -i "s/{account_id}/${{ secrets.AWS_ACCOUNT_ID }}/g" backend/policies/*.yml

      - name: Validate all policies
        run: |
          custodian validate policy.yml
          custodian validate backend/policies/realtime-tag-enforcement.yml
          custodian validate backend/policies/scheduled-scan.yml
          custodian validate backend/policies/tag-change-rescan.yml
