name: Deploy Cloud Custodian Policies

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cloud Custodian
        run: pip install c7n

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Replace account ID in policies
        run: |
          sed -i "s/{account_id}/${{ secrets.AWS_ACCOUNT_ID }}/g" backend/policies/*.yml

      - name: Validate policies
        run: |
          custodian validate backend/policies/realtime-tag-enforcement.yml
          custodian validate backend/policies/scheduled-scan.yml
          custodian validate backend/policies/tag-change-rescan.yml

      - name: Deploy real-time policies
        run: |
          custodian run -s s3://custodian-results-${{ secrets.AWS_ACCOUNT_ID }}/policies \
            backend/policies/realtime-tag-enforcement.yml

      - name: Deploy tag-change rescan policy
        run: |
          custodian run -s s3://custodian-results-${{ secrets.AWS_ACCOUNT_ID }}/policies \
            backend/policies/tag-change-rescan.yml

      - name: Deploy scheduled policies
        run: |
          custodian run -s s3://custodian-results-${{ secrets.AWS_ACCOUNT_ID }}/policies \
            backend/policies/scheduled-scan.yml
